name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    if: github.repository == 'nguyenthdat/fc-trading'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          metadata="$(cargo metadata --format-version 1 --no-deps)"

          for package in ssi-fc-trading fctrading-cli; do
            package_version="$(
              jq -r --arg package "${package}" \
                '.packages[] | select(.name == $package) | .version' \
                <<<"${metadata}"
            )"

            if [[ "${package_version}" != "${tag_version}" ]]; then
              echo "${package} version ${package_version} does not match tag ${tag_version}" >&2
              exit 1
            fi
          done

      - name: Run release checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Verify packages
        run: |
          cargo package --package ssi-fc-trading --locked
          cargo package --workspace --locked --no-verify

      - name: Publish library crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --package ssi-fc-trading --locked

      - name: Publish CLI crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --package fctrading-cli --locked
