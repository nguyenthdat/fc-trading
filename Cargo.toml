[workspace]
members = ["crates/fc-trading", "crates/fc-trading-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nguyenthdat/fctrading-rs"

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
quick-xml = { version = "0.38", features = ["serialize"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "query", "rustls", "stream"] }
rpassword = "7"
rsa = { version = "0.9.10", features = ["sha2"] }
rust_decimal = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
url = { version = "2", features = ["serde"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
mod_module_files = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
